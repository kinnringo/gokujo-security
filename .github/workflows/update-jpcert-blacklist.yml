name: Update JPCERT Blacklist

on:
  schedule:
    # 毎月1日 02:00 UTC に実行
    - cron: "0 2 1 * *"
  workflow_dispatch:
    # 手動実行も可能

permissions:
  contents: write

jobs:
  update-blacklist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run JPCERT blacklist update script
        id: update
        run: python scripts/update_jpcert_blacklist.py

      - name: Commit and push if changed
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules.json
          git commit -m "chore: update JPCERT blacklist [$(date -u +%Y-%m-%d)]"
          git push
